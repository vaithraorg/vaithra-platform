<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Vaithra</title>
  <style>body{font-family:system-ui;margin:0;background:#f7f8fb}.wrap{max-width:700px;margin:0 auto;padding:24px}.form{background:#fff;padding:16px;border-radius:10px;box-shadow:0 6px 18px rgba(12,40,80,0.04)} label{display:block;margin-top:8px} input,textarea{width:100%;padding:8px;margin-top:6px;border:1px solid #e6eef9;border-radius:6px}</style>
</head>
<body>
  <div class="wrap">
    <a href="index.html">← Home</a>
    <h1>Contact Us</h1>
    <div class="form">
      <form action="#" method="post">
        <label>Name <input type="text" name="name" required></label>
        <label>Email <input type="email" name="email" required></label>
        <label>Message <textarea name="message" rows="6" required></textarea></label>
        <p style="color:#666;font-size:0.95rem">This form is a placeholder. Wire to your backend / email service or use a SaaS form provider.</p>
        <button type="submit" style="background:#0b74de;color:#fff;padding:10px 14px;border-radius:8px;border:0;margin-top:8px">Send</button>
      </form>
    </div>
  </div>
</body>
</html>
